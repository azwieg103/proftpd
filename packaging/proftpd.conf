# ZWIEGNET ProFTPD configuration.
#
# SECURITY DEFAULT: all FTP logins are denied until an administrator
# explicitly configures authentication and TLS, then changes the LOGIN
# policy below. Do not remove this restriction before TLS is working.

ServerName                      "ProFTPD Server"
ServerType                      standalone
DefaultServer                   on
Port                            21
Umask                           022 022
MaxInstances                    30
User                            proftpd
Group                           proftpd
DefaultRoot                     ~
UseIPv6                         on
UseReverseDNS                   off
IdentLookups                    off
RequireValidShell               on
AllowOverwrite                  off
TimeoutIdle                     600
TimeoutNoTransfer               900
TimeoutStalled                  300
PassivePorts                    49152 65534

# Fail closed: no account can log in until the administrator has configured
# TLS, authentication, firewall policy, and deliberately enabled logins.
<Limit LOGIN>
  DenyAll
</Limit>

# Example TLS configuration. Install a trusted certificate and private key,
# then uncomment and adjust these paths. TLSRequired on prevents cleartext
# control and data connections. Verify this configuration before enabling
# LOGIN access above.
#
# TLSEngine                       on
# TLSRequired                     on
# TLSRSACertificateFile           /etc/pki/tls/certs/proftpd.pem
# TLSRSACertificateKeyFile        /etc/pki/tls/private/proftpd.key
