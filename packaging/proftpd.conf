# ZWIEGNET ProFTPD configuration.
# Configure TLS, passive ports, authentication and firewall rules before
# enabling this service on an Internet-facing system.

ServerName                      "ProFTPD Server"
ServerType                      standalone
DefaultServer                   on
Port                            21
Umask                           022 022
MaxInstances                    30
User                            proftpd
Group                           proftpd
DefaultRoot                     ~
UseIPv6                         on
UseReverseDNS                   off
IdentLookups                    off
RequireValidShell               on
AllowOverwrite                  on
TimeoutIdle                     600
TimeoutNoTransfer               900
TimeoutStalled                  300
PassivePorts                    49152 65534

<Limit LOGIN>
  AllowAll
</Limit>

# TLS is not enabled by default. Configure mod_tls and certificate paths
# before allowing credentials or file data over an untrusted network.
